<style>
:root{

  --soft:#f7f8fa; --nav-on:#e8eef8; --nav-on-ink:#0b4a94; --accent:#1f2328; --accent-ink:#ffffff;
  --past:#f1f3f5; --frz:#edf2fa; --frz-line:#9db7e4; --ovr:#fff4cc; --warn-bg:#fff8e6; --warn-line:#f0d58a; --warn-ink:#6b4e00;

:root[data-theme="dark"]{

  --soft:#20252c; --nav-on:#243247; --nav-on-ink:#9cc0f0; --accent:#e7eaef; --accent-ink:#15181d;
  --past:#262b33; --frz:#1f2a3a; --frz-line:#4e6d9c; --ovr:#3d3410; --warn-bg:#332b10; --warn-line:#6b5a1f; --warn-ink:#f0d58a;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.45;color:var(--ink);background:var(--bg)}
a{color:var(--link);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
h1{margin:0;font-size:22px;font-weight:600;line-height:1.3}
h2{margin:0;font-size:15px;font-weight:600}
.app{display:flex;flex-wrap:wrap;min-height:100%}
.nav{width:220px;padding:20px 12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav .brand{font-size:15px;font-weight:600;padding:6px 14px 16px}
.nav a{display:block;padding:10px 14px;border-radius:6px;font-size:14px;color:var(--ink)}
.nav a.on{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}
.nav .spacer{flex-grow:1}
.nav .who{font-size:12px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line);margin-top:8px}
main{flex:999 1 560px;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.crumb{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.grow{flex-grow:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.panel.pad{padding:14px 16px}
.panel .head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600}
.btn{font-weight:600;line-height:20px;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:40px;color:var(--ink)}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:38px;color:var(--ink);width:100%}
.fld{display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg button{font-size:12px;font-weight:600;padding:8px 12px;border:0;background:transparent;cursor:pointer;min-height:36px;border-right:1px solid var(--line);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.arc td{color:var(--mute)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:11px;font-weight:600;line-height:18px;padding:1px 8px;border-radius:9px;white-space:nowrap}
.p-model{background:var(--p-model-bg);color:var(--p-model)} .p-man{background:var(--p-man-bg);color:var(--p-man)} .p-tur{background:var(--p-tur-bg);color:var(--p-tur)} .p-yuk{background:var(--p-yuk-bg);color:var(--p-yuk)} .p-sen{background:var(--p-sen-bg);color:var(--p-sen)}
.good{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.amber{color:var(--amber);font-weight:600}.mute{color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:-1px}
.st-live{color:var(--good);font-weight:600}.st-frz{color:var(--mute);font-weight:600}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabs a{font-size:14px;font-weight:600;padding:10px 4px;border-bottom:2px solid transparent;color:var(--mute)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.cards{display:flex;flex-wrap:wrap;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel);min-width:150px;flex:1 1 150px}
.card .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:10px 14px;color:var(--warn-ink)}
.infobox{background:var(--nav-on);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);align-items:center}
.legend .sw{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
/* grid */
.g{border-collapse:collapse;font-size:12px;width:100%}
.g th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:var(--soft);text-align:right;white-space:nowrap}
.g th:first-child{text-align:left}
.g td{padding:0;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.g td:first-child{text-align:left;padding:7px 10px;font-weight:600;background:var(--soft)}
.g .c{display:block;padding:7px 8px;min-height:18px}
.g .past{background:var(--past);color:var(--mute)}
.g .frz{background:var(--frz);color:var(--mute);border-top:2px solid var(--frz-line)}
.g .tot{font-weight:600;background:var(--soft)}
.g input{font-size:12px;width:100%;min-width:72px;padding:7px 8px;border:0;background:transparent;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.g input::placeholder{color:var(--mute);font-style:italic;opacity:.8}
.g td.ovr{background:var(--ovr)}
.g td.selc{outline:2px solid var(--link);outline-offset:-2px}
/* steps */
.stp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.stp .n{width:24px;height:24px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--panel)}
.stp.on{color:var(--ink);font-weight:600}.stp.on .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stp.done .n{background:var(--p-man-bg);color:var(--p-man);border-color:var(--p-man-bg)}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt input{margin-top:2px;flex-shrink:0}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.rn{width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.drv{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);width:100%;border:0;background:transparent;text-align:left}
.drv.on{background:var(--nav-on);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--p-sen-bg);color:var(--p-sen)}
.bar{height:10px;border-radius:5px;background:var(--p-yuk-bg);overflow:hidden;display:flex}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column}
.modal.wide{max-width:980px}
.modal .mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.x{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--mute);padding:6px 10px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.prog{height:8px;background:var(--p-yuk-bg);border-radius:4px;overflow:hidden}
.prog div{height:100%;background:var(--accent);width:0;transition:width .4s}
.empty{padding:40px;text-align:center;color:var(--mute)}
@media (max-width:760px){ main{padding:16px} .nav{width:100%;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:10px} .nav .brand{width:100%;padding-bottom:8px} .nav .spacer,.nav .who{display:none} }
@media (prefers-reduced-motion: reduce){ .toast,.prog div{transition:none} }
</style>

/* hierarchy helpers */
function findNode(id,nodes){ for(const n of nodes||[]){ if(n.id===id) return n; const f=findNode(id,n.children); if(f) return f; } return null; }
function leafShare(n){ return n.children? n.children.reduce((a,c)=>a+leafShare(c),0) : (n.share||0); }
function allIds(n,acc=[]){ acc.push(n.id); (n.children||[]).forEach(c=>allIds(c,acc)); return acc; }
function scopeInfo(dim,sel){ const roots=TREE[dim].nodes; const nodes=sel.map(id=>findNode(id,roots)).filter(Boolean);
  // drop nodes whose ancestor is also selected
  const top=nodes.filter(n=>!nodes.some(o=>o!==n&&allIds(o).includes(n.id)));
  const factor=Math.min(1,top.reduce((a,n)=>a+leafShare(n),0)); const isAll=top.some(n=>roots.includes(n));
  const leaves=top.reduce((a,n)=>a+(n.children?allIds(n).length-1:1),0);
  return {label:isAll?'Tüm kapsam':(top.map(n=>n.name).slice(0,3).join(', ')+(top.length>3?' +'+(top.length-3):'')), factor:isAll?1:factor, count:leaves, top};
}
function snapView(values,k){ if(k==='current') return values; const cut=TODAY-k; return values.map((v,i)=> v==null?null: i<cut? v : Math.round(v*(1+0.012*k*Math.sin(i/2+k)))); }
function snapActual(k){ return k==='current'? ACT : ACT.slice(0,TODAY-k+1); }

  state.entry[fid]={rows, saved:true};

const pct = (a,b) => b? ((a-b)/b*100) : 0;
const fmtP = p => (p>0?'+':'')+'%'+p.toLocaleString('tr-TR',{maximumFractionDigits:1});

/* scenario math */
function scenarioSeries(s){
  const base = fc(s.base);
  const baseFut = fut(base.values).map((v,i)=> v==null ? fut(ML)[i] : v);
  const ran = !!s.lastRun && !s.driversDirty;
  let drv = baseFut.map((v,i)=> (base.type==='Model' && ran) ? v*(1 - 0.0017*(s.tufe[i]-TUFE_BASE[i])) : v);
  const driverEffect = sum(drv)-sum(baseFut);
  let cur = drv.slice(); const ruleEffects=[];
  s.rules.forEach(r=>{
    const before = sum(cur);
    cur = cur.map((v,i)=>{ if(i<r.start||i>r.end) return v; if(r.type==='Çarpan') return v*(1+r.param/100); if(r.type==='Ek değer') return v+r.param; if(r.type==='Tavan') return Math.min(v,r.param); if(r.type==='Taban') return Math.max(v,r.param); return v; });
    ruleEffects.push(sum(cur)-before);

  return {baseFut, drv, out:cur.map(Math.round), driverEffect, ruleEffects, ran, baseTotal:sum(baseFut)};
}

/* chart */
function lineChart(series, opts={}){
  const w=900,h=opts.h||260,pl=46,pr=12,pt=14,pb=28;
  const labels = opts.labels||ALL; const n=labels.length;
  let lo=Infinity,hi=-Infinity; series.forEach(s=>s.values.forEach(v=>{ if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);} }));
  if(!isFinite(lo)){lo=0;hi=1;} const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
  const x=i=>pl+(w-pl-pr)*i/(n-1), y=v=>pt+(h-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<4;k++){ const v=lo+(hi-lo)*k/3; g+=`<line x1="${pl}" y1="${y(v)}" x2="${w-pr}" y2="${y(v)}" stroke="var(--line2)"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="var(--mute)" text-anchor="end">${opts.fmt?opts.fmt(v):fmtK(v)}</text>`; }
  if(opts.today!=null){ g+=`<rect x="${x(opts.today)}" y="${pt}" width="${x(opts.today+2)-x(opts.today)}" height="${h-pt-pb}" fill="var(--frz)"/><line x1="${x(opts.today)}" y1="${pt}" x2="${x(opts.today)}" y2="${h-pb}" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="${x(opts.today)+4}" y="${pt+10}" font-size="10" fill="var(--ink)">bugün</text><text x="${x(opts.today+1)}" y="${h-pb-4}" font-size="9" fill="var(--mute)" text-anchor="middle">freeze</text>`; }
  series.forEach(s=>{ let pts=[],segs=[]; s.values.forEach((v,i)=>{ if(v==null){ if(pts.length) segs.push(pts); pts=[]; } else pts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); }); if(pts.length) segs.push(pts);
    segs.forEach(p=>{ g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?'stroke-dasharray="6 4"':''} points="${p.join(' ')}"/>`; }); });
  for(let i=0;i<n;i+=Math.ceil(n/10)){ g+=`<text x="${x(i)}" y="${h-8}" font-size="10" fill="var(--mute)" text-anchor="middle">${labels[i]}</text>`; }
  const leg = series.map(s=>`<span><span class="sw" style="background:${s.color};${s.dash?'opacity:.7':''}"></span>${esc(s.name)}</span>`).join('');
  return `<div class="legend" style="margin-bottom:6px">${leg}</div><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(opts.label||'Grafik')}" style="display:block">${g}</svg>`;
}

function cellCard(fid){

  const row=e.rows[s.r], v=row.val[s.c], ml=row.ml[s.c], rs=row.reason[s.c]; const d=v==null?0:pct(v,ml);

function pKarsilastir(){
  const all = state.forecasts.filter(f=>f.status!=='Arşiv').map(f=>({id:f.id,name:f.name,type:f.type})).concat(state.scenarios.map(s=>({id:s.id,name:s.name,type:'Senaryo'})));

      <div class="fld"><span class="lbl">Kapsam</span><button class="btn" data-act="scope-open" data-target="wizard" style="text-align:left;align-self:flex-start">${esc(w.scopeLabel||'Marmara, Ege, İç Anadolu +1, 12 alt üye')} ▾</button><div class="hint">Kullanıcılar bu kapsam içinde kendi satır yetkileriyle girer</div></div>`;
    let specific='';
    if(w.type==='Manuel') specific=`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label class="lbl" for="wo">Sahip ekip</label><select id="wo" class="sel" data-act="wiz-field" data-k="owner"><option>Satış</option><option>Planlama</option><option>Pazarlama</option><option>Finans</option></select><div class="hint">Bu ekip kendi satır yetkisi içinde girer</div></div><div class="fld"><label class="lbl" for="wb">Boş hücre</label><select id="wb" class="sel"><option>Referansı kabul et (ML talep tahmini)</option><option>Boş say, konsensüste sonraki adıma geç</option><option>Sıfır</option></select></div><div class="fld"><label class="lbl" for="wt">Gerekçe eşiği</label><div class="row"><input id="wt" type="text" class="sel" style="width:90px" value="${w.threshold}" data-act="wiz-field" data-k="threshold"><span class="hint">% ve üzeri sapmada gerekçe kodu istenir</span></div></div><div class="fld"><label class="lbl" for="wr">Grid de referans</label><select id="wr" class="sel"><option>ML talep tahmini</option><option>Geçen yıl</option><option>Yok</option></select></div></div><label class="chk"><input type="checkbox" checked data-act="wiz-field" data-k="cockpit">Kokpitte göster</label>`;
    else if(w.type==='Yüklenen') specific=`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label class="lbl" for="ws">Kaynak</label><select id="ws" class="sel"><option>Excel dosyası</option><option>Tablo bağlantısı (MS SQL)</option><option>Tablo bağlantısı (BigQuery)</option></select></div><div class="fld"><label class="lbl" for="wo">Yükleyen ekip</label><select id="wo" class="sel" data-act="wiz-field" data-k="owner"><option>Finans</option><option>Planlama</option></select></div></div><label class="chk"><input type="checkbox" checked data-act="wiz-field" data-k="cockpit">Kokpitte göster</label>`;
    else if(w.type==='Model') specific=`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label class="lbl" for="wp">Model paketi</label><select id="wp" class="sel"><option>pharma_scurve_v2</option><option>seasonal_naive</option><option>driver_regression</option></select></div><div class="fld"><label class="lbl" for="wds">Sürücü seti</label><select id="wds" class="sel"><option>Baz (OVP 2027)</option><option>Yüksek enflasyon</option></select></div><div class="fld"><label class="lbl" for="wz">Zamanlama</label><select id="wz" class="sel"><option>Her gün 06:00</option><option>Haftalık</option><option>Elle</option></select></div></div><div class="hint">Model tipi yönetici yetkisi ister; bu prototipte izin verildi.</div>`;
    return mh('Yeni tahmin: '+w.type)+`<div class="mb">${steps}${common}${specific}${w.type!=='Model'?where:''}</div><div class="mf"><button class="btn" data-act="wiz-back">Geri</button><button class="btn pri" data-act="wiz-next">${w.type==='Manuel'?'Kaydet ve girişe geç':w.type==='Yüklenen'?'Devam: Dosya':'Kaydet'}</button></div>`;
  }
  // step 3: upload
  return mh('Yeni tahmin: '+esc(w.name)+', dosya')+`<div class="mb">${steps}
    <div class="row"><button class="btn" data-act="toast" data-m="Şablon indirildi: satırlar ${esc(w.level)}, sütunlar Oca 27 ile Mar 28">Şablonu indir</button><span class="hint">Şablon, tanımdaki seviye ve ufka göre üretilir</span></div>
    <div style="border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--soft)" class="row"><div class="grow"><div style="font-weight:600">${w.file?'butce_2027_v3.xlsx':'Dosya seçilmedi'}</div><div class="hint">${w.file?'184 KB, 2 sayfa, "Adet" sayfası okunuyor':'xlsx veya csv'}</div></div><button class="btn" data-act="wiz-file">${w.file?'Başka dosya seç':'Dosya seç'}</button></div>
    ${w.file?`<h2>Kolon eşleştirme</h2><table class="tbl"><thead><tr><th>Dosyadaki kolon</th><th>Örnek</th><th>Platform alanı</th><th>Durum</th></tr></thead><tbody><tr><td>Urun_Grubu</td><td>ONKOLOJI</td><td><select class="sel"><option>Ürün grubu (kod)</option><option>Yok say</option></select></td><td class="good">14/14 eşleşti</td></tr><tr><td>Bolge</td><td>MARMARA</td><td><select class="sel"><option>Bölge (kod)</option><option>Yok say</option></select></td><td class="amber">1 eşleşmeyen: GUNEYDOGU</td></tr><tr><td>2027-01 … 2028-03</td><td>12.400</td><td><select class="sel"><option>Dönem sütunları (ay)</option></select></td><td class="good">15 dönem</td></tr></tbody></table>
    <h2>Doğrulama</h2><table class="tbl"><tbody><tr><td>Satır sayısı</td><td class="num">56 satır, 840 hücre</td><td></td></tr><tr><td>Eşleşmeyen üye</td><td class="amber">1 satır</td><td><select class="sel"><option>Satırı atla</option><option>"Doğu ve Güneydoğu" ile eşle</option><option>Yüklemeyi durdur</option></select></td></tr><tr><td>Boş hücre</td><td class="amber">12 hücre</td><td><select class="sel"><option>Boş bırak</option><option>Sıfır yaz</option></select></td></tr><tr><td>Freeze veya geçmiş dönemine değer</td><td class="good">Yok</td><td></td></tr><tr><td>Toplam, 15 dönem</td><td class="num">9,84 mn adet</td><td class="hint">ML toplamından %6,2 yüksek</td></tr></tbody></table>`:''}
    </div><div class="mf"><button class="btn" data-act="wiz-back">Geri</button><button class="btn pri" data-act="wiz-finish" ${w.file?'':'disabled'}>Yükle ve kaydet</button></div>`;
}

function reasonModal(fid,r,c){ const e=state.entry[fid]; const row=e.rows[r]; const v=row.val[c], ml=row.ml[c], cur=row.reason[c]||{};
  return mh('Gerekçe: '+esc(row.name)+', '+FUT[c])+`<div class="mb"><div class="hint">Girilen ${fmt(v)}, referans ${fmt(ml)}, fark ${fmtP(pct(v,ml))}. Referanstan %${fc(fid).reasonThreshold||10} ve üzeri sapmada gerekçe zorunlu.</div>
    <div class="fld"><label class="lbl" for="gk">Gerekçe kodu</label><select id="gk" class="sel">${REASONS.map(x=>`<option ${cur.code===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="fld"><label class="lbl" for="gn">Not</label><textarea id="gn" class="sel" rows="3">${esc(cur.note||'')}</textarea><div class="hint">İhale, Lansman ve Rakip hareketi kodlarında not zorunlu</div></div></div>
    <div class="mf"><button class="btn" data-act="reason-cancel" data-id="${fid}" data-r="${r}" data-c="${c}">Vazgeç, değeri geri al</button><button class="btn pri" data-act="reason-ok" data-id="${fid}" data-r="${r}" data-c="${c}">Kaydet</button></div>`; }

    <label class="chk"><input type="checkbox" id="mc" checked>Kokpitte göster</label></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="move-ok" data-ids="${ids.join(',')}">Taşı</button></div>`; }

function bulkModal(fid,kind){ return mh(kind==='pct'?'Yüzde uygula':'Toplam gir ve dağıt')+`<div class="mb">
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label class="lbl" for="b1">Başlangıç</label><select id="b1" class="sel">${FUT.map((m,i)=>`<option value="${i}" ${i===2?'selected':''}>${m}</option>`).join('')}</select></div><div class="fld"><label class="lbl" for="b2">Bitiş</label><select id="b2" class="sel">${FUT.map((m,i)=>`<option value="${i}" ${i===5?'selected':''}>${m}</option>`).join('')}</select></div></div>
  <div class="fld"><label class="lbl" for="bs">Satırlar</label><select id="bs" class="sel"><option value="all">Tüm bölgeler</option>${REGIONS.map((r,i)=>`<option value="${i}">${r}</option>`).join('')}</select></div>
  ${kind==='pct'?`<div class="fld"><label class="lbl" for="bv">Referansın (ML) yüzde kaçı üstü veya altı</label><div class="row"><input id="bv" class="sel" style="width:110px" value="5"><span class="hint">Örnek: 5 yazınca ML x 1,05; -8 yazınca ML x 0,92</span></div></div>`
  :`<div class="fld"><label class="lbl" for="bv">Dönem başına toplam (adet)</label><div class="row"><input id="bv" class="sel" style="width:140px" value="40.000"><span class="hint">Bölgelere geçmiş paya göre dağıtılır</span></div></div>`}
  <div class="hint">Eşiği aşan hücrelerde gerekçe tek seferde sorulur.</div></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="bulk-ok" data-id="${fid}" data-kind="${kind}">Uygula</button></div>`; }

function scopeModal(target){
  const d=state.scopeDraft; const info=scopeInfo(d.dim,d.sel);
  const q=(d.q||'').toLowerCase();
  const node=(n,depth)=>{ const on=d.sel.includes(n.id); const covered=!on&&d.sel.some(id=>{ const p=findNode(id,TREE[d.dim].nodes); return p&&p!==n&&allIds(p).includes(n.id); });
    const match=!q||n.name.toLowerCase().includes(q)||(n.children||[]).some(c=>allIds(c).some(id=>findNode(id,TREE[d.dim].nodes).name.toLowerCase().includes(q)));
    if(!match) return '';
    return `<label class="chk" style="padding:6px 0 6px ${depth*22}px;${covered?'color:var(--mute)':''}"><input type="checkbox" data-act="scope-toggle" data-id="${n.id}" ${on||covered?'checked':''} ${covered?'disabled':''}>${esc(n.name)}${n.children?`<span class="hint">(${allIds(n).length-1})</span>`:''}</label>${(n.children||[]).map(c=>node(c,depth+1)).join('')}`; };
  return mh('Kapsam seç')+`<div class="mb">
    <div class="row"><div class="seg">${Object.keys(TREE).map(k=>`<button data-act="scope-dim" data-v="${k}" class="${d.dim===k?'on':''}">${TREE[k].name}</button>`).join('')}</div><input type="search" class="sel" style="width:220px" placeholder="Ara" value="${esc(d.q||'')}" data-act="scope-q" aria-label="Ara"><div class="grow"></div><span class="hint">Seçili: ${esc(info.label)}, ${info.count} alt üye, payı %${Math.round(info.factor*100)}</span></div>
    <div class="row" style="gap:8px"><span class="lbl">Kayıtlı gruplar</span>${GROUPS.filter(g=>g.dim===d.dim).map((g,i)=>`<button class="btn sm" data-act="scope-group" data-i="${GROUPS.indexOf(g)}">${esc(g.name)}</button>`).join('')||'<span class="hint">yok</span>'}<button class="btn sm" data-act="toast" data-m="Seçim grup olarak kaydedildi; herkesle paylaşılabilir">Seçimi grup olarak kaydet</button></div>
    <div class="panel pad" style="max-height:360px;overflow:auto">${TREE[d.dim].nodes.map(n=>node(n,0)).join('')}</div>
    <div class="hint">Üst düğüm seçilince altındakiler kapsanır. Ağaçta olmayan üye kümeleri için grup kaydedilir; grup seviye gibi davranır.</div></div>
    <div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="scope-ok" data-target="${target}">Uygula</button></div>`;
}
function runModal(title,lines,onDone){ openModal(mh(title)+`<div class="mb"><div class="prog"><div id="pg"></div></div><div id="pl" class="hint">${lines[0]}</div></div>`); let i=0; const bar=document.getElementById('pg'); const tick=()=>{ i++; if(bar) bar.style.width=Math.min(100,i*100/lines.length)+'%'; const pl=document.getElementById('pl'); if(pl&&lines[i]) pl.textContent=lines[i]; if(i<lines.length) setTimeout(tick,550); else setTimeout(()=>{closeModal(); onDone();},300); }; setTimeout(tick,500); }
function confirmModal(title,text,act,data,btn){ openModal(mh(title)+`<div class="mb"><div>${text}</div></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="${act}" ${data}>${btn||'Onayla'}</button></div>`); }

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, r=route();
  if(el.tagName==='INPUT'&&['cell','drv-cell','cons-field','wiz-field','scen-desc','weight','drv-const','drv-pct'].includes(act)) return;
  switch(act){
    case 'close': closeModal(); break;
    case 'close-bd': if(e.target===el) closeModal(); break;
    case 'toast': toast(el.dataset.m); break;
    case 'scope-open': { const t=el.dataset.target; let src=state.scope; if(t.startsWith('scenario:')){ const s=sc(t.split(':')[1]); src=s.scopeObj||{dim:'geo',sel:['tr']}; } else if(t==='wizard'){ src=state.wizard.scopeObj||{dim:'geo',sel:['mar','ege','ic','akd']}; } else if(t==='rule'){ src=state.ruleScope||{dim:'geo',sel:['tr']}; } state.scopeDraft={dim:src.dim,sel:src.sel.slice(),q:''}; openModal(scopeModal(t),true); break; }
    case 'scope-dim': state.scopeDraft.dim=el.dataset.v; state.scopeDraft.sel=[]; openModal(scopeModal(document.querySelector('[data-act=scope-ok]').dataset.target),true); break;
    case 'scope-toggle': { const d=state.scopeDraft; const n=findNode(id,TREE[d.dim].nodes); const desc=allIds(n).slice(1); if(el.checked){ d.sel=d.sel.filter(x=>!desc.includes(x)); d.sel.push(id); } else d.sel=d.sel.filter(x=>x!==id); openModal(scopeModal(document.querySelector('[data-act=scope-ok]').dataset.target),true); break; }
    case 'scope-group': { const g=GROUPS[Number(el.dataset.i)]; state.scopeDraft.dim=g.dim; state.scopeDraft.sel=g.sel.slice(); openModal(scopeModal(document.querySelector('[data-act=scope-ok]').dataset.target),true); break; }
    case 'scope-ok': { const d=state.scopeDraft; const info=scopeInfo(d.dim,d.sel); const t=el.dataset.target; const obj={dim:d.dim,sel:d.sel.slice(),label:info.label,factor:info.factor};
      if(t==='cockpit'){ state.scope=obj; } else if(t.startsWith('scenario:')){ const s=sc(t.split(':')[1]); s.scope=info.label; s.scopeObj=obj; } else if(t==='wizard'){ state.wizard.scopeObj=obj; state.wizard.scopeLabel=info.label+', '+info.count+' alt üye'; } else if(t==='rule'){ state.ruleScope=obj; }
      closeModal(); if(t==='wizard') openModal(wizardHtml(),true); else render(); break; }
    case 'snap-current': e.preventDefault(); state.snap='current'; render(); break;
    case 'alert-close': { const a=state.alerts.find(x=>x.id===id); a.status='closed'; toast('Uyarı kapatıldı, audit e yazıldı'); render(); break; }
    case 'toggle-theme': { const root=document.documentElement; const cur=root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); root.dataset.theme = cur==='dark'?'light':'dark'; break; }
    case 'seg': state[el.dataset.key]=el.dataset.v; render(); break;
    case 'cockpit-sel': { const i=state.cockpitSel.indexOf(id); if(el.checked&&i<0) state.cockpitSel.push(id); if(!el.checked&&i>=0) state.cockpitSel.splice(i,1); if(r.page==='kokpit') render(); break; }
    case 'scen-sel': case 'cmp-sel': { const i=state.compareSel.indexOf(id); if(el.checked&&i<0) state.compareSel.push(id); if(!el.checked&&i>=0) state.compareSel.splice(i,1); if(r.page==='karsilastir') render(); break; }
    case 'run-model': runModal('ML talep tahmini çalışıyor',['Veri çekiliyor: 1.240 seri, 36 ay','Sürücü seti birleştiriliyor: Baz (OVP 2027)','Model çalışıyor','Uzlaştırma: SKU dan bölgeye','Tamamlandı'],()=>{ fc(id).updated=now()+', elle'; toast('ML talep tahmini güncellendi, 41 sn'); render(); }); break;
    case 'show-rule': { const f=fc(id); openModal(mh(f.name+': kural')+`<div class="mb"><div class="warnbox">Bu kural kilitli. Değişiklik için yeni konsensüs tanımı açılır.</div><div class="kv"><span>Tip</span><span>${f.rule.kind}</span></div>${f.rule.chain.map((c,i)=>`<div class="step"><div class="rn">${i+1}</div><div>${esc(c)}</div></div>`).join('')}${f.rule.exceptions.length?`<div class="lbl">İstisnalar</div>${f.rule.exceptions.map(x=>`<div>${esc(x)}</div>`).join('')}`:''}<div class="kv"><span>Durum</span><span class="${f.status==='Canlı'?'st-live':'st-frz'}">${f.status}</span></div></div><div class="mf"><button class="btn" data-act="close">Kapat</button><a class="btn pri" href="#/konsensus" data-act="close" style="display:inline-block">Yeni tanım aç</a></div>`); break; }
    case 'reupload': state.wizard={step:3,type:'Yüklenen',name:fc(id).name,desc:'',level:'Ürün grubu',owner:'Finans',color:'#6b7280',cockpit:true,threshold:10,file:false,reupload:id}; openModal(wizardHtml(),true); break;
    case 'freeze': confirmModal('Dondur',`<strong>${esc(fc(id).name)}</strong> bugünkü değerlerinde sabitlenir; baz tahmin yenilense de değişmez. Bu işlem geri alınmaz; tekrar canlısı istenirse senaryo yeniden taşınır.`,'freeze-ok',`data-id="${id}"`,'Dondur'); break;
    case 'freeze-ok': fc(id).status='Dondurulmuş'; fc(id).updated=now()+' da donduruldu'; closeModal(); toast(fc(id).name+' donduruldu'); render(); break;
    case 'detail': { const f=fc(id); openModal(mh(f.name)+`<div class="mb"><div class="kv"><span>Tip</span><span class="pill p-sen">Senaryodan</span></div><div class="kv"><span>Kaynak senaryo</span><span>${esc(f.from||'')}</span></div><div class="kv"><span>Durum</span><span>${f.status}</span></div><div class="kv"><span>Güncelleme</span><span>${esc(f.updated)}</span></div></div><div class="mf"><button class="btn" data-act="close">Kapat</button></div>`); break; }
    case 'wizard': state.wizard={step:1,type:'Manuel',name:'',desc:'',level:'Bölge',owner:'Satış',color:'#7c3aed',cockpit:true,threshold:10,file:false,grain:'Aylık'}; openModal(wizardHtml(),true); break;
    case 'wiz-type': state.wizard.type=el.dataset.v; openModal(wizardHtml(),true); break;
    case 'wiz-back': state.wizard.step--; openModal(wizardHtml(),true); break;
    case 'wiz-file': state.wizard.file=true; openModal(wizardHtml(),true); break;
    case 'wiz-next': { const w=state.wizard;
      if(w.step===1){ if(w.type==='Türetilmiş'){ closeModal(); go('#/konsensus'); break; } w.step=2; if(!w.name) w.name = w.type==='Manuel'?'Pazarlama tahmini':w.type==='Yüklenen'?'Bütçe 2027 revize':'Yeni model tahmini'; openModal(wizardHtml(),true); break; }
      if(w.step===2){ if(!w.name.trim()){ toast('Ad boş olamaz'); break; }
        if(w.type==='Manuel'){ const nid='m'+Date.now(); state.forecasts.splice(3,0,{id:nid,name:w.name,type:'Manuel',owner:w.owner+' ekibi',level:w.level,grain:w.grain,updated:now()+', '+state.user.name+' (tanım)',fill:0,mape:0,status:'Canlı',cockpit:w.cockpit,color:w.color,values:ML.map(()=>null),reasonThreshold:Number(w.threshold)||10}); if(w.cockpit) state.cockpitSel.push(nid); closeModal(); toast(w.name+' oluşturuldu, içerik girişi açıldı'); go('#/giris/'+nid); break; }
        if(w.type==='Yüklenen'){ w.step=3; openModal(wizardHtml(),true); break; }
        state.forecasts.unshift({id:'mo'+Date.now(),name:w.name,type:'Model',owner:'Sistem',level:'SKU',updated:'Henüz çalıştırılmadı',fill:0,mape:0,status:'Canlı',cockpit:true,color:w.color,values:ML.map(()=>null)}); closeModal(); toast(w.name+' kaydedildi; ilk çalıştırma listeden'); render(); break; }
      break; }
    case 'wiz-finish': { const w=state.wizard; if(w.reupload){ const f=fc(w.reupload); f.updated=now()+', dosya'; closeModal(); toast(f.name+' yeniden yüklendi, önceki yükleme versiyon olarak saklandı'); render(); break; }
      const nid='u'+Date.now(); state.forecasts.push({id:nid,name:w.name,type:'Yüklenen',owner:w.owner,level:w.level,grain:w.grain,updated:now()+', dosya',fill:98,mape:0,status:'Dondurulmuş',cockpit:w.cockpit,color:w.color,values:BUD.map((v,i)=>i<13?null:Math.round(v*0.98))}); if(w.cockpit) state.cockpitSel.push(nid); closeModal(); toast(w.name+' yüklendi ve tahmin listesine eklendi'); go('#/tahminler'); break; }
    case 'new-scenario': openModal(mh('Yeni senaryo')+`<div class="mb"><div class="fld"><label class="lbl" for="nn">Ad</label><input id="nn" class="sel" value="Yeni senaryo"></div><div class="fld"><label class="lbl" for="nb">Baz tahmin</label><select id="nb" class="sel">${state.forecasts.filter(f=>f.status!=='Arşiv').map(f=>`<option value="${f.id}">${esc(f.name)} (${f.type})</option>`).join('')}</select><div class="hint">Baz model ise sürücüler açılır; değilse yalnızca çıktı kuralları</div></div></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="new-scenario-ok">Oluştur ve aç</button></div>`); break;
    case 'new-scenario-ok': { const nid='s'+Date.now(); const name=document.getElementById('nn').value||'Yeni senaryo'; const base=document.getElementById('nb').value; state.scenarios.push({id:nid,name,base,scope:'Tüm kapsam',start:0,desc:'',tufe:TUFE_BASE.slice(),method:'Sabit',rules:[],lastRun:null,driversDirty:true,moved:false}); closeModal(); go('#/senaryo/'+nid); break; }
    case 'del-scen': confirmModal('Senaryoyu sil',`<strong>${esc(sc(id).name)}</strong> silinecek.${sc(id).moved?' Tahmin listesine taşınmış kopyası silinmez.':''} Senaryolar kendiliğinden silinmez; bu işlem sadece sizin kararınız.`,'del-scen-ok',`data-id="${id}"`,'Sil'); break;
    case 'del-scen-ok': state.scenarios=state.scenarios.filter(s=>s.id!==id); state.compareSel=state.compareSel.filter(x=>x!==id); closeModal(); toast('Senaryo silindi'); go('#/tahminler'); break;
    case 'move-one': openModal(moveModal([id])); break;
    case 'move-selected': { const ids=state.compareSel.filter(x=>sc(x)); if(!ids.length){ toast('Önce senaryo seç'); break; } openModal(moveModal(ids)); break; }
    case 'move-ok': { const ids=el.dataset.ids.split(','); const mode=document.querySelector('input[name=md]:checked').value; const ck=document.getElementById('mc').checked; ids.forEach(sid=>{ const s=sc(sid); const name=ids.length===1?(document.getElementById('mn').value||s.name):s.name; const nid='f'+Date.now()+sid; const res=scenarioSeries(s); state.forecasts.push({id:nid,name,type:'Senaryodan',owner:state.user.name,level:fc(s.base).level,updated:'Baz: '+fc(s.base).name+', '+(s.rules.length?s.rules.length+' kural':'kural yok')+(mode==='Dondurulmuş'?', '+now()+' da donduruldu':''),fill:100,mape:0,status:mode,cockpit:ck,color:'#d97706',from:s.name,values:ML.map((v,i)=>i<15?null:res.out[i-15])}); if(ck) state.cockpitSel.push(nid); s.moved=true; }); closeModal(); toast(ids.length>1?'Senaryolar tahmin listesine taşındı':'Senaryo tahmin listesine taşındı'); go('#/tahminler'); break; }
    case 'save-scen': sc(id).saved=true; toast('Senaryo kaydedildi'); break;
    case 'run-scen': { const s=sc(id); const isModel=fc(s.base).type==='Model'; runModal(s.name+' çalışıyor', isModel?['Sürücü seti hazırlanıyor','Model çalışıyor: 1.240 seri','Kurallar uygulanıyor','Uzlaştırma','Tamamlandı']:['Kurallar uygulanıyor','Uzlaştırma','Tamamlandı'],()=>{ s.lastRun=now(); s.driversDirty=false; toast('Çalıştırma tamamlandı; önizleme güncellendi'); render(); }); break; }
    case 'drv': state.driverSel=el.dataset.k; render(); break;
    case 'drv-method': sc(id).method=el.dataset.v; render(); break;
    case 'rule-add': { const s=sc(id); const g=x=>document.getElementById(x); const type=g('rt').value; const param=parseNum(g('rp').value); if(param==null){ toast('Parametre sayı olmalı'); break; } const reason=g('rg').value; const note=g('rn').value; if(['İhale','Lansman','Rakip hareketi'].includes(reason)&&!note.trim()){ toast(reason+' kodunda not zorunlu'); g('rn').focus(); break; } s.rules.push({type,scope:g('rk').dataset.v,start:Number(g('rb').value),end:Number(g('re').value),param,reason,note}); toast('Kural eklendi'); render(); break; }
    case 'rule-del': sc(id).rules.splice(Number(el.dataset.i),1); render(); break;
    case 'rule-up': { const i=Number(el.dataset.i); if(i>0){ const a=sc(id).rules; [a[i-1],a[i]]=[a[i],a[i-1]]; render(); } break; }
    case 'cons-kind': state.consDraft.kind=el.dataset.v; render(); break;
    case 'chain-add': { const d=state.consDraft; const free=state.forecasts.find(f=>f.type!=='Türetilmiş'&&f.status!=='Arşiv'&&!d.chain.includes(f.id)); d.chain.push(free?free.id:'ml'); render(); break; }
    case 'chain-del': state.consDraft.chain.splice(Number(el.dataset.i),1); render(); break;
    case 'exc-add': openModal(mh('İstisna ekle')+`<div class="mb"><div class="fld"><label class="lbl" for="xc">Koşul</label><select id="xc" class="sel"><option>ABC sınıfı = C</option><option>Kapsam = Yeni ürünler grubu</option><option>Ufuk 4. ay ve sonrası</option><option>Kanal = İhale</option></select></div><div class="fld"><label class="lbl" for="xr">Kural</label><select id="xr" class="sel"><option>Doğrudan: ML talep tahmini</option><option>Doğrudan: Satış tahmini</option><option>Doğrudan: Planlama tahmini</option><option>Ağırlıklı: ML 0,6, Planlama 0,4</option></select></div></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="exc-ok">Ekle</button></div>`); break;
    case 'exc-ok': state.consDraft.exceptions.push({cond:document.getElementById('xc').value,rule:document.getElementById('xr').value}); closeModal(); render(); break;
    case 'exc-del': state.consDraft.exceptions.splice(Number(el.dataset.i),1); render(); break;
    case 'cons-save': { const d=state.consDraft; confirmModal('Kaydet ve kilitle',`<strong>${esc(d.name)}</strong> kaydedilecek ve kural kilitlenecek. Konsensüs v2 arşive gider, kokpitte v3 onun yerine geçer. Bundan sonra değişiklik yeni tanım gerektirir.`,'cons-save-ok','','Kaydet ve kilitle'); break; }
    case 'cons-save-ok': { const d=state.consDraft; const old=state.forecasts.find(f=>f.type==='Türetilmiş'&&f.status==='Canlı'); if(old){ old.status='Arşiv'; old.updated=old.updated+', '+now()+' da kapatıldı'; state.cockpitSel=state.cockpitSel.filter(x=>x!==old.id); } const nid='c'+Date.now(); const idx=state.forecasts.findIndex(f=>f.type==='Türetilmiş'); state.forecasts.splice(idx<0?3:idx,0,{id:nid,name:d.name,type:'Türetilmiş',owner:'Planlama',level:'SKU',updated:'Kural: '+(d.kind==='Öncelik zinciri'?d.chain.map(c=>fc(c).name.replace(' tahmini','').toLowerCase()).join(', yoksa '):d.kind.toLowerCase()),fill:100,mape:3.1,status:'Canlı',cockpit:true,color:'#111827',values:ML.map((v,i)=>i<13?null:Math.round(v*1.005)),rule:{kind:d.kind,chain:d.chain.map(c=>fc(c).name),exceptions:d.exceptions.map(x=>x.cond+': '+x.rule)}}); state.cockpitSel.push(nid); state.consDraft=null; closeModal(); toast(d.name+' kaydedildi ve kilitlendi'); go('#/tahminler'); break; }
    case 'excel-dl': toast('Excel indirildi: Marmara, 5 bölge x 15 dönem, kilitli hücreler korumalı'); break;
    case 'excel-ul': openModal(mh('Excel yükle')+`<div class="mb"><div style="border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--soft)" class="row"><div class="grow"><div style="font-weight:600">satis_tahmini_marmara.xlsx</div><div class="hint">Şablondan, 5 satır x 15 dönem</div></div></div><h2>Fark listesi</h2><table class="tbl"><thead><tr><th>Hücre</th><th class="num">Ekranda</th><th class="num">Dosyada</th><th class="num">Fark</th></tr></thead><tbody><tr><td>Bursa, Oca 27</td><td class="num mute">boş</td><td class="num">7.300</td><td class="num good">yeni</td></tr><tr><td>Bursa, Şub 27</td><td class="num mute">boş</td><td class="num">7.150</td><td class="num good">yeni</td></tr><tr><td>Kocaeli, Mar 27</td><td class="num">5.800</td><td class="num">6.400</td><td class="num amber">+%10,3, gerekçe istenecek</td></tr><tr><td>İstanbul Avrupa, Kas 26</td><td class="num mute">freeze</td><td class="num">13.300</td><td class="num bad">atlandı</td></tr></tbody></table><div class="hint">Yalnızca düzenlenebilir hücreler okunur; freeze ve geçmiş atlanır.</div></div><div class="mf"><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="excel-ul-ok" data-id="${r.id}">3 değişikliği uygula</button></div>`); break;
    case 'excel-ul-ok': { const e=initEntry(id); e.rows[2].val[0]=7300; e.rows[2].val[1]=7150; e.rows[3].val[2]=6400; state.unsaved+=3; closeModal(); render(); state.selCell={r:3,c:2}; openModal(reasonModal(id,3,2)); break; }
    case 'copy-ref': { const e=initEntry(id); let n=0; e.rows.forEach(row=>row.val.forEach((v,i)=>{ if(v==null){ row.val[i]=row.ml[i]; n++; } })); state.unsaved+=n; toast(n+' boş hücre referansla dolduruldu'); render(); break; }
    case 'save-entry': { const e=initEntry(id); const f=fc(id); const total=e.rows.length*15, filled=e.rows.reduce((a,row)=>a+row.val.filter(v=>v!=null).length,0); f.fill=Math.round(filled/total*100); f.updated=now()+', '+state.user.name; const vals=FUT.map((m,i)=>e.rows.reduce((a,row)=>a+(row.val[i]??row.ml[i]),0)); f.values=ML.map((v,i)=>i<15?null:vals[i-15]); state.unsaved=0; toast('Kaydedildi; konsensüs ve kokpit güncel değeri okuyor'); render(); break; }
    case 'bulk': openModal(bulkModal(id,el.dataset.kind)); break;
    case 'bulk-ok': { const e=initEntry(id); const g=x=>document.getElementById(x); const a=Number(g('b1').value), b=Number(g('b2').value), rs=g('bs').value, v=parseNum(g('bv').value); if(v==null||a>b){ toast('Aralık veya değer hatalı'); break; } const rows=rs==='all'?e.rows.map((_,i)=>i):[Number(rs)]; let n=0, big=0; rows.forEach(ri=>{ const row=e.rows[ri]; for(let c=a;c<=b;c++){ row.val[c]= el.dataset.kind==='pct'? Math.round(row.ml[c]*(1+v/100)) : Math.round(v*SHARE[ri]); n++; if(Math.abs(pct(row.val[c],row.ml[c]))>=(fc(id).reasonThreshold||10)) big++; } }); state.unsaved+=n; closeModal(); render(); if(big){ openModal(mh('Toplu gerekçe')+`<div class="mb"><div class="hint">${big} hücre referanstan eşik üstü sapıyor. Tek gerekçe hepsine yazılır.</div><div class="fld"><label class="lbl" for="gk">Gerekçe kodu</label><select id="gk" class="sel">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="fld"><label class="lbl" for="gn">Not</label><textarea id="gn" class="sel" rows="2"></textarea></div></div><div class="mf"><button class="btn pri" data-act="bulk-reason-ok" data-id="${id}" data-a="${a}" data-b="${b}" data-rows="${rows.join(',')}">Kaydet</button></div>`); } else toast(n+' hücre güncellendi'); break; }
    case 'bulk-reason-ok': { const e=initEntry(id); const code=document.getElementById('gk').value, note=document.getElementById('gn').value; el.dataset.rows.split(',').forEach(ri=>{ const row=e.rows[Number(ri)]; for(let c=Number(el.dataset.a);c<=Number(el.dataset.b);c++){ if(Math.abs(pct(row.val[c],row.ml[c]))>=(fc(id).reasonThreshold||10)) row.reason[c]={code,note,by:state.user.name,at:now(),prev:row.ml[c]}; } }); closeModal(); toast('Toplu değişiklik ve gerekçe kaydedildi'); render(); break; }
    case 'reason': state.selCell={r:Number(el.dataset.r),c:Number(el.dataset.c)}; openModal(reasonModal(id,Number(el.dataset.r),Number(el.dataset.c))); break;
    case 'reason-ok': { const e=initEntry(id); const row=e.rows[Number(el.dataset.r)]; const c=Number(el.dataset.c); const code=document.getElementById('gk').value, note=document.getElementById('gn').value; if(['İhale','Lansman','Rakip hareketi'].includes(code)&&!note.trim()){ toast(code+' kodunda not zorunlu'); break; } row.reason[c]={code,note,by:state.user.name,at:now(),prev:row.reason[c]?row.reason[c].prev:row.ml[c]}; closeModal(); const keep=state.selCell; render(); state.selCell=keep; refreshCell(id); break; }
    case 'reason-cancel': { const e=initEntry(id); const row=e.rows[Number(el.dataset.r)]; const c=Number(el.dataset.c); row.val[c]=row.pending!=null?row.pending:null; delete row.pending; state.unsaved=Math.max(0,state.unsaved-1); closeModal(); render(); break; }
    case 'history': openModal(mh('Değişiklik geçmişi')+`<div class="mb"><table class="tbl"><thead><tr><th>Zaman</th><th>Kim</th><th>Hücre</th><th class="num">Önce</th><th class="num">Sonra</th><th>Gerekçe</th></tr></thead><tbody><tr><td>14.10.2026 16:40</td><td>A. Yılmaz</td><td>İstanbul Avrupa, Mar 27</td><td class="num">14.100</td><td class="num">14.600</td><td>Kampanya</td></tr><tr><td>14.10.2026 16:12</td><td>A. Yılmaz</td><td>Toplu: Nis, May 27</td><td class="num">ML</td><td class="num">ML +%3</td><td>eşik altı</td></tr><tr><td>01.10.2026 00:00</td><td>Sistem</td><td>Snapshot Eylül</td><td colspan="3" class="hint">Freeze Kasım, Aralık a kaydı; Mar 28 sütunu eklendi</td></tr></tbody></table></div><div class="mf"><button class="btn" data-act="close">Kapat</button></div>`); break;
    case 'undo': toast('Son değişiklik geri alındı (prototipte simgesel)'); break;
  }
});
function refreshCell(fid){ const c=document.getElementById('cellcard'); if(c) c.innerHTML=cellCard(fid); document.querySelectorAll('.g td.selc').forEach(t=>t.classList.remove('selc')); if(state.selCell){ const td=document.getElementById(`c-${state.selCell.r}-${state.selCell.c}`); if(td) td.classList.add('selc'); } }
document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-act="cell"]'); if(!el) return; state.selCell={r:Number(el.dataset.r),c:Number(el.dataset.c)}; refreshCell(route().id); });
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act, id=el.dataset.id;
  if(act==='snap'){ state.snap = el.value==='current'?'current':Number(el.value); render(); return; }
  if(act==='scope-q'){ state.scopeDraft.q=el.value; openModal(scopeModal(document.querySelector('[data-act=scope-ok]').dataset.target),true); const q=document.querySelector('[data-act=scope-q]'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} return; }
  if(act==='cell'){ const e2=initEntry(route().id); const row=e2.rows[Number(el.dataset.r)], c=Number(el.dataset.c); const v=parseNum(el.value); const prev=row.val[c]; row.pending=prev; row.val[c]=v; el.value=v==null?'':fmt(v); state.unsaved++; const T=fc(route().id).reasonThreshold||10; const sub=document.querySelector('main .sub'); if(sub) sub.innerHTML=`Kapsamınız: Marmara, ${fc(route().id).level}, <span class="amber">${state.unsaved} kaydedilmemiş hücre</span>`; const tot=el.closest('tr').lastElementChild.querySelector('.c'); if(tot) tot.textContent=fmt(sum(row.val.map((x,i)=>x??row.ml[i]))); if(v!=null&&Math.abs(pct(v,row.ml[c]))>=T&&!row.reason[c]) openModal(reasonModal(route().id,Number(el.dataset.r),c)); else refreshCell(route().id); }
  else if(act==='drv-cell'){ const s=sc(id); const v=parseNum(el.value); if(v!=null){ s.tufe[Number(el.dataset.i)]=v; s.driversDirty=true; render(); } }
  else if(act==='drv-const'){ const s=sc(id); const v=parseNum(el.value); if(v!=null){ for(let i=s.start;i<15;i++) s.tufe[i]=v; s.driversDirty=true; render(); } }
  else if(act==='drv-pct'){ const s=sc(id); const v=parseNum(el.value); if(v!=null){ for(let i=s.start;i<15;i++) s.tufe[i]=TUFE_BASE[i]+v; s.driversDirty=true; render(); } }
  else if(act==='scen-base'){ const s=sc(id); s.base=el.value; s.driversDirty=true; render(); }
  else if(act==='scen-start'){ sc(id).start=Number(el.value); render(); }
  else if(act==='scen-desc'){ sc(id).desc=el.value; }
  else if(act==='cons-field'){ state.consDraft[el.dataset.k]=el.value; }
  else if(act==='chain-set'){ state.consDraft.chain[Number(el.dataset.i)]=el.value; render(); }
  else if(act==='weight'){ state.consDraft.weights[id]=parseNum(el.value)||0; }
  else if(act==='wiz-field'){ const k=el.dataset.k; state.wizard[k]= el.type==='checkbox'? el.checked : el.value; }
});
render();
</script>
