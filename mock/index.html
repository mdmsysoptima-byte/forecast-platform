<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forecast Platformu — mock</title>
  <link rel="stylesheet" href="../frontend/static/vendor/metis.css" />
  <link rel="stylesheet" href="../frontend/static/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M6 22 L12 14 L18 18 L26 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body class="admin-layout">

  <!-- Oturum acma -->
  <div id="login" class="auth-screen">
    <div class="card auth-card">
      <div class="card-body p-4 p-lg-5">
        <div class="auth-mark mb-3">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 38 L14 22 L24 29 L44 6" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="29" r="3" fill="currentColor" />
          </svg>
        </div>
        <h1 class="h4 mb-1">Forecast Platformu</h1>
        <p class="text-muted mb-4">Senaryo kur, çalıştır, uzlaştır, onayla.</p>
        <form id="login-form" autocomplete="on">
          <div class="mb-3">
            <label class="form-label" for="email">E-posta</label>
            <input id="email" name="email" type="email" class="form-control" value="planner@demo.local" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Şifre</label>
            <input id="password" name="password" type="password" class="form-control" value="demo" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Oturum aç</button>
          <div id="login-error" class="alert alert-danger mt-3 mb-0 py-2" role="alert" hidden></div>
        </form>
        <hr class="my-4" />
        <p class="text-uppercase fw-semibold text-muted mb-2" style="font-size:.6875rem;letter-spacing:.06em">
          Demo kullanıcıları
        </p>
        <div id="login-user-list" class="d-flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <!-- Uygulama kabugu -->
  <div id="shell" class="admin-app" hidden>
    <div class="admin-wrapper" id="admin-wrapper">

      <header class="admin-header">
        <nav class="navbar navbar-expand-lg border-bottom">
          <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#/cockpit">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M2 19 L7 11 L12 14.5 L22 3" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="fw-semibold d-none d-sm-inline">Forecast</span>
            </a>

            <button class="hamburger-menu" type="button" data-sidebar-toggle aria-label="Menüyü aç kapat"
                    aria-controls="admin-sidebar" aria-expanded="false">
              <i class="bi bi-list"></i>
            </button>

            <!-- Tema hamburger dugmesini kenar menunun sag kenarina mutlak konumluyor,
                 bu yuzden sol taraf bos birakildi. Ekran adi sayfa basligindan okunur. -->
            <div class="flex-grow-1 min-w-0" aria-hidden="true"></div>
            <span id="view-title" class="visually-hidden">Kokpit</span>

            <div class="d-flex align-items-center gap-2">
              <span id="cycle-chip" class="badge rounded-pill cycle-chip"></span>
              <button id="assistant-toggle" class="btn btn-outline-secondary btn-sm" type="button" title="Asistan">
                <i class="bi bi-chat-dots"></i><span class="d-none d-lg-inline ms-1">Asistan</span>
              </button>
              <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button" title="Görünüm">
                <i class="bi bi-sun-fill" data-theme-icon="light"></i>
                <i class="bi bi-moon-fill" data-theme-icon="dark" hidden></i>
              </button>
              <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2"
                        data-bs-toggle="dropdown" aria-expanded="false">
                  <span id="who-initials" class="avatar-initials">--</span>
                  <span id="who-name" class="d-none d-md-inline"></span>
                  <i class="bi bi-chevron-down"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><h6 class="dropdown-header" id="who-roles"></h6></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><button class="dropdown-item" type="button" id="logout">
                    <i class="bi bi-box-arrow-right me-2"></i>Oturumu kapat</button></li>
                </ul>
              </div>
            </div>
          </div>
        </nav>
      </header>

      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="sidebar-content">
          <nav class="sidebar-nav" aria-label="Ana menü">
            <ul class="nav flex-column" id="sidebar-items"></ul>
          </nav>
        </div>
      </aside>
      <div class="sidebar-backdrop" aria-hidden="true"></div>

      <main id="main-content" class="admin-main" tabindex="-1">
        <div id="view" class="container-fluid p-3 p-lg-4"></div>
      </main>

    </div>

    <aside id="assistant" class="assistant-panel" hidden aria-label="Asistan">
      <div class="assistant-head">
        <span class="fw-semibold"><i class="bi bi-chat-dots me-2"></i>Asistan</span>
        <button id="assistant-close" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Kapat">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div id="assistant-log" class="assistant-log"></div>
      <form id="assistant-form" class="assistant-form">
        <input id="assistant-input" type="text" class="form-control form-control-sm"
               placeholder="Örnek: Marmara'yı ilçe bazında göster" />
        <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-send"></i></button>
      </form>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="../frontend/static/vendor/bootstrap.bundle.min.js"></script>
  <script src="../frontend/static/vendor/apexcharts.min.js"></script>
  <script>window.__MOCK_SESSION__ = {"token": "mock", "user": {"id": 1, "name": "Ayşe Yılmaz", "email": "admin@demo.local", "roles": ["admin"], "restricted": false}};</script>
  <script src="mock-api.js"></script>
  <script type="module" src="../frontend/static/js/app.js"></script>
</body>
</html>
